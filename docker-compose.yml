version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: job-automation-app
    container_name: job-automation-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - job-automation
    environment:
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable

  web:
    image: nginx:alpine
    container_name: job-automation-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - job-automation
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: job-automation-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-job_automation}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-job_automation}
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - job-automation

  redis:
    image: redis:alpine
    container_name: job-automation-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - job-automation

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job-automation-worker
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./:/var/www
    networks:
      - job-automation
    depends_on:
      - redis
      - db
    environment:
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job-automation-scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - ./:/var/www
    networks:
      - job-automation
    depends_on:
      - redis
      - db

networks:
  job-automation:
    driver: bridge

volumes:
  dbdata:
  redisdata:
