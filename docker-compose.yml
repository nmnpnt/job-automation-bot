version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: job_automation_postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: job_automation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: job_automation_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  scraper:
    build: 
      context: ./bot
    container_name: job_automation_scraper
    ports:
      - "8001:8000"
    volumes:
      - ./bot:/app
      - ./storage/app/bot-sessions:/app/sessions
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
